<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学走班教学工作台 · IGB / IG1 / IG3</title>
<style>

  :root{
    --bg:#eef1f8; --bg2:#e9eef9;
    --card:#ffffff;
    --line:#e4e9f3; --line-soft:#eef1f7; --line-strong:#d3dcec;
    --txt:#22304a; --muted:#7e8da8; --faint:#aab6c9;
    --pri:#3e6df0; --pri-d:#2c51cf; --pri-bg:#eaf1ff; --pri-bd:#cdddfe;
    --green:#0f9d5c; --green-bg:#e5f7ee; --green-bd:#bce8d1;
    --red:#e0454f; --red-bg:#fdecee; --red-bd:#f6c7cb;
    --orange:#d5850a; --orange-bg:#fcf2dd; --orange-bd:#f1d8a0;
    --gray:#67758f; --gray-bg:#eef1f6; --gray-bd:#d8deea;
    --hi-bg:#fde9d5; --hi-bd:#f6c9a0; --hi-tx:#b2590f;
    --lo-bg:#dceafc; --lo-bd:#b3d1f5; --lo-tx:#2e6fc0;
    --shadow-sm:0 1px 2px rgba(24,39,74,.05);
    --shadow-md:0 2px 6px rgba(24,39,74,.05), 0 14px 30px -20px rgba(24,39,74,.22);
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 70%, #e4eaf6 100%);
    background-attachment:fixed;
    color:var(--txt); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{height:11px; width:11px;}
  ::-webkit-scrollbar-thumb{background:#c6cfdf; border-radius:8px; border:3px solid transparent; background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#aeb9cf; border:3px solid transparent; background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- 顶栏 ---------- */
  header.topbar{
    background:rgba(255,255,255,.86); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:0 18px; height:58px; display:flex; align-items:center; gap:20px;
    position:sticky; top:0; z-index:50;
  }
  .brand{font-size:15px; font-weight:800; letter-spacing:.3px; white-space:nowrap;
    display:flex; align-items:center; gap:9px; color:#22304a;}
  .brand .logo{
    width:27px; height:27px; border-radius:8px; flex:none;
    background:linear-gradient(135deg,#5b86f6,#2e56d6); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; box-shadow:0 3px 8px -2px rgba(46,86,214,.55);
  }
  .brand small{color:var(--muted); font-weight:400; font-size:11px; margin-left:4px; letter-spacing:0;}
  .class-nav{display:flex; gap:8px; flex:1;}
  .cls-btn{
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 15px;
    font-size:13px; font-weight:600; color:#46536b; display:inline-flex; align-items:center; gap:8px;
    box-shadow:var(--shadow-sm); transition:.16s;
  }
  .cls-btn:hover{border-color:#b9ccfa; color:var(--pri); transform:translateY(-1px);}
  .cls-btn.on{
    background:linear-gradient(135deg,#4a76f2,#2e56d6); color:#fff; border-color:transparent;
    box-shadow:0 5px 14px -4px rgba(46,86,214,.55);
  }
  .cls-btn .n{font-size:11px; font-weight:600; opacity:.8;
    background:rgba(120,140,180,.14); padding:1px 7px; border-radius:20px;}
  .cls-btn.on .n{background:rgba(255,255,255,.22);}
  .top-acts{display:flex; gap:8px; align-items:center;}
  .mini-btn{
    border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:9px;
    font-size:12px; color:#4b5a73; box-shadow:var(--shadow-sm); transition:.15s;
  }
  .mini-btn:hover{border-color:var(--pri); color:var(--pri); transform:translateY(-1px);}
  .save-dot{font-size:11px; color:var(--muted); white-space:nowrap;}

  /* ---------- 视图切换 ---------- */
  .view-bar{max-width:1380px; margin:0 auto; padding:16px 18px 0; display:flex; gap:6px;}
  .view-tab{
    padding:9px 20px; border-radius:12px 12px 0 0; font-size:14px; font-weight:700;
    color:#6b7a95; display:inline-flex; align-items:center; gap:7px;
    background:transparent; transition:.15s; position:relative;
  }
  .view-tab:hover{background:rgba(255,255,255,.7); color:var(--pri);}
  .view-tab small{font-weight:400; color:var(--muted); font-size:11px;}
  .view-tab.on{background:#fff; color:var(--pri);
    box-shadow:0 -2px 8px rgba(24,39,74,.04), 0 2px 0 0 #fff;}
  .view-tab.on::before{content:""; position:absolute; top:0; left:14px; right:14px; height:3px;
    border-radius:0 0 4px 4px; background:linear-gradient(90deg,#5b86f6,#2e56d6);}

  /* ---------- 主体 ---------- */
  main{max-width:1380px; margin:0 auto; padding:0 18px 40px;}
  .page-card{background:var(--card); border-radius:var(--radius);
    box-shadow:var(--shadow-md); margin-top:0; overflow:hidden;
    border:1px solid rgba(255,255,255,.7);}

  /* ================= 座位 ================= */
  .seat-wrap{display:flex; gap:16px; padding:16px; align-items:flex-start;}
  .pool-col{width:252px; flex:none; background:linear-gradient(180deg,#fafcff,#f5f8fe);
    border:1px solid var(--line); border-radius:14px; padding:13px;
    position:sticky; top:72px; box-shadow:var(--shadow-sm);}
  .pool-title{font-weight:800; margin-bottom:2px; font-size:14px;
    display:flex; justify-content:space-between; align-items:baseline;}
  .pool-title span{color:var(--muted); font-size:11px; font-weight:500;}
  .pool-sub{font-size:12px; color:var(--muted); margin-bottom:9px; line-height:1.5;}
  .add-row{display:flex; gap:6px; margin-bottom:10px;}
  .add-row input{
    flex:1; border:1px solid var(--line); border-radius:9px; padding:6px 9px; font-size:12px;
    min-width:0; background:#fff; transition:.15s; outline:none;
  }
  .add-row input:focus{border-color:var(--pri); box-shadow:0 0 0 3px rgba(62,109,240,.12);}
  .add-row button{border-radius:9px; padding:5px 12px; background:var(--pri-bg);
    color:var(--pri); border:1px solid var(--pri-bd); font-size:12px; font-weight:700; transition:.15s;}
  .add-row button:hover{background:#dbe8ff;}
  .pool-list{display:flex; flex-direction:column; gap:5px; max-height:56vh; overflow:auto; padding-right:2px;}
  .chip{
    display:flex; align-items:center; gap:7px; padding:5px 9px; border-radius:10px; background:#fff;
    border:1px solid var(--line); cursor:grab; user-select:none; font-size:13px;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .chip:hover{border-color:#b9ccfa; transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .chip:active{cursor:grabbing;}
  .chip.sel{border-color:var(--pri); background:var(--pri-bg); box-shadow:0 0 0 3px rgba(62,109,240,.16);}
  .chip.dragging{opacity:.45;}
  .pool-chip .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .pool-chip .rm{color:#b9c3d4; font-size:12px; padding:0 3px; visibility:hidden; border-radius:6px;}
  .pool-chip:hover .rm{visibility:visible;}
  .pool-chip .rm:hover{color:var(--red); background:var(--red-bg);}
  .chip .tag{
    font-size:10px; color:#5b6b88; background:#eef2f8; border-radius:6px;
    padding:0 5px; line-height:16px; flex:none; font-weight:600;
  }
  .pool-tools{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .pool-tools button{
    border:1px solid var(--line); border-radius:9px; padding:7px; font-size:12px; font-weight:600;
    background:#fff; color:#4b5a73; transition:.15s;
  }
  .pool-tools button:hover{border-color:var(--pri); color:var(--pri); background:var(--pri-bg);}
  .pool-hint{font-size:11px; color:#a3b0c5; margin-top:9px; line-height:1.7;}
  .pool-target{border:1.5px dashed #c9d5ea; border-radius:10px; min-height:48px; display:none;}
  .pool-target.over{background:#f4f8ff; border-color:var(--pri);}

  .stage-col{flex:1; min-width:0;}
  .stage-toolbar{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 16px;
    background:linear-gradient(180deg,#fbfdff,#f4f7fd); border-bottom:1px solid var(--line);
  }
  .stage-toolbar .grp{display:flex; align-items:center; gap:7px; font-size:12px; color:#5a6a86; font-weight:600;}
  .num-ctl{display:inline-flex; align-items:center; border:1px solid var(--line);
    border-radius:9px; overflow:hidden; background:#fff; box-shadow:var(--shadow-sm);}
  .num-ctl button{width:25px; height:25px; line-height:1; font-size:15px; color:#5a6a86; transition:.12s;}
  .num-ctl button:hover{background:var(--pri-bg); color:var(--pri);}
  .num-ctl b{min-width:32px; text-align:center; font-size:13px;}
  .toolbar-note{font-size:12px; color:#8fa0b8;}
  .chk{display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; font-size:13px; color:#46536b;}
  .chk input{accent-color:var(--pri); width:15px; height:15px; cursor:pointer;}
  .chk.locked-tip{color:var(--pri); font-weight:600;}

  .stage-body{background:
      radial-gradient(1000px 300px at 50% -80px, rgba(62,109,240,.06), transparent),
      linear-gradient(180deg,#fbfdff, #f2f6fc);
    padding:20px 18px; border-radius:0 0 var(--radius) var(--radius);}
  .lectern{
    width:340px; max-width:80%; margin:0 auto 22px; text-align:center; font-size:12px; color:#7c8ba7;
    border:1px solid var(--pri-bd); background:linear-gradient(180deg,#eef4ff,#e6eefd);
    border-radius:12px; padding:7px; letter-spacing:12px; font-weight:700;
    box-shadow:inset 0 1px 0 #fff, var(--shadow-sm);
  }
  .seat-grid{display:flex; flex-direction:column; gap:12px; align-items:center;}
  .seat-row{display:flex; gap:12px; justify-content:center;}
  .seat{
    width:100px; height:74px; border-radius:13px; background:#fff;
    border:1.5px solid #dbe3f0; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    transition:transform .13s, box-shadow .13s, border-color .13s;
  }
  .seat:hover{transform:translateY(-2px); border-color:var(--pri);
    box-shadow:0 8px 18px -10px rgba(62,109,240,.45);}
  .seat .av{width:26px; height:26px; font-size:12px;}
  .seat .seat-inner{font-size:13px; font-weight:600; color:#33425c; text-align:center;
    padding:3px 4px; line-height:1.3; max-width:100%; display:flex; flex-direction:column;
    align-items:center; gap:2px;}
  .seat .snm{font-size:13px; font-weight:700; line-height:1.15;}
  .seat .seat-tag{font-size:9px; color:#8fa0b8; font-weight:500; line-height:1.1;}
  .seat:hover{border-color:#a9c0f5;}
  .seat.empty{border-style:dashed; border-color:#cdd8ea; background:rgba(255,255,255,.5);}
  .seat.empty .seat-inner{color:#aeb9cc; font-weight:400;}
/* 座位整块可拖动；点选后再点目标座位也可换座。 */
.seat[draggable="true"]{cursor:grab;user-select:none}
.seat[draggable="true"]:active{cursor:grabbing}
.seat.sel{outline:3px solid #4268ed;outline-offset:3px;box-shadow:0 0 0 6px #4268ed26}
.seat.dragging{opacity:.45}
  .seat.dropover{border-color:var(--pri); background:var(--pri-bg); transform:scale(1.04);}
  .seat .del{
    position:absolute; top:-7px; right:-7px; width:18px; height:18px; line-height:16px; text-align:center;
    background:#fff; border:1px solid var(--line-strong); border-radius:50%; color:#9aa8bf;
    font-size:11px; opacity:0; transition:.12s; box-shadow:var(--shadow-sm);
  }
  .seat:hover .del{opacity:1;}
  .seat .del:hover{background:var(--red); border-color:var(--red); color:#fff;}
  .seat-num{position:absolute; left:6px; top:4px; font-size:9px; color:#b7c2d6; font-weight:600;}
  .empty-seat-dots{display:flex; gap:3px;}
  .empty-seat-dots i{width:5px;height:5px;border-radius:50%;background:#cfd8e8;}

  /* ---------- 成绩徽章 / 成绩锁 / 班级图例 ---------- */
  .scb{
    display:inline-flex; align-items:center; font-size:10px; font-weight:800; line-height:15px;
    padding:0 5px; border-radius:8px; flex:none; vertical-align:1px; letter-spacing:.3px;
  }
  .pool-chip .scb{margin-left:auto;}
  .score-toggle{
    border:1px solid var(--orange-bd); background:var(--orange-bg); color:var(--orange);
    border-radius:9px; padding:5px 11px; font-size:12px; font-weight:700; white-space:nowrap;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .score-toggle:hover{transform:translateY(-1px); filter:brightness(.97);}
  .score-toggle.on{
    border-color:var(--green-bd); background:var(--green-bg); color:var(--green);
  }
  .cls-legend{
    display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap;
    margin-top:16px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .cls-legend .lg-t{font-size:11px; color:#8fa0b8; font-weight:700;}
  .cls-legend .lg-chip{
    font-size:11px; font-weight:800; border-radius:14px; padding:1px 9px; line-height:18px;
  }
  .cls-legend .lg-note{font-size:11px; color:#a3b0c5; margin-left:6px;}

  /* ---------- 头像 ---------- */
  .av{
    width:22px; height:22px; border-radius:50%; flex:none; color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; line-height:1; letter-spacing:0;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.14);
  }

  /* ================= 作业 ================= */
  .hw-wrap{padding:16px;}
  .hw-toolbar{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .palette{
    display:flex; gap:5px; align-items:center; flex-wrap:wrap;
    background:#f4f7fc; border:1px solid var(--line); padding:6px 8px; border-radius:12px;
  }
  .palette .lbl{font-size:12px; color:#7d8ca6; font-weight:600; margin-right:3px;}
  .p-btn{
    border:1px solid transparent; background:#fff; border-radius:8px; padding:5px 9px;
    font-size:12px; display:inline-flex; align-items:center; gap:5px; color:#46536b;
    box-shadow:var(--shadow-sm); transition:.12s; font-weight:600;
  }
  .p-btn b{font-size:13px; line-height:1;}
  .p-btn:hover{transform:translateY(-1px);}
  .p-btn.on{box-shadow:0 0 0 2px #fff, 0 0 0 4px rgba(62,109,240,.35); border-color:var(--pri); color:var(--pri);}
  .p-div{width:1px; height:22px; background:var(--line); margin:0 5px;}
  .p-btn.done b{color:var(--green);}
  .p-btn.miss b{color:var(--red);}
  .p-btn.late b{color:var(--orange);}
  .p-btn.leave b{color:var(--gray);}
  .p-btn.hi b{color:var(--hi-tx);}
  .p-btn.lo b{color:var(--lo-tx);}
  .hw-btn{
    border:1px solid var(--pri-bd); color:var(--pri); background:var(--pri-bg);
    border-radius:9px; padding:6px 13px; font-size:12px; font-weight:700; white-space:nowrap;
    transition:.15s; display:inline-flex; align-items:center; gap:5px;
  }
  .hw-btn:hover{background:#dce9ff; transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .hw-hint{font-size:12px; color:#97a5bb; line-height:1.6; margin-bottom:10px;}

  /* ---------- 概览条 ---------- */
  .ov{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px;
    background:linear-gradient(180deg,#ffffff,#f8fafd);
    border:1px solid var(--line); border-radius:13px; padding:11px 14px; margin-bottom:12px;
    box-shadow:var(--shadow-sm);
  }
  .ov-hd{display:flex; align-items:center; gap:9px; flex:none;}
  .ov-tag{
    font-size:11px; font-weight:700; color:var(--pri); background:var(--pri-bg);
    border:1px solid var(--pri-bd); padding:2px 8px; border-radius:20px; letter-spacing:.5px;
  }
  .ov-week{font-size:15px; font-weight:800; color:#22304a;}
  .ov-idle{color:#a3b0c5; font-size:13px; flex:1;}
  .ov-g{display:flex; flex-direction:column; gap:3px; min-width:170px; flex:1 1 170px;}
  .ov-gt{display:flex; justify-content:space-between; font-size:12px; color:#7e8da8; font-weight:600;}
  .ov-gt b{font-size:14px; color:#22304a;}
  .ov-pct{color:var(--pri);}
  .bar{height:7px; border-radius:5px; background:rgba(70,83,107,.09); overflow:hidden;}
  .bar i{display:block; height:100%; width:0; border-radius:5px;
    background:linear-gradient(90deg,#7ba3f8,#3e6df0); transition:width .4s;}
  .bar i.ok{background:linear-gradient(90deg,#3dd68c,#0f9d5c);}
  .bar i.mid{background:linear-gradient(90deg,#ffd166,#ef9f1f);}
  .bar i.low{background:linear-gradient(90deg,#ff8f97,#e0454f);}
  .ov-st{display:flex; gap:6px; flex-wrap:wrap; flex:none;}
  .ov-k{font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; line-height:1.5;}
  .ov-k b{font-size:12px;}
  .ov-k.d{background:var(--green-bg); color:var(--green); border:1px solid var(--green-bd);}
  .ov-k.x{background:var(--red-bg); color:var(--red); border:1px solid var(--red-bd);}
  .ov-k.p{background:var(--orange-bg); color:var(--orange); border:1px solid var(--orange-bd);}
  .ov-k.l{background:var(--gray-bg); color:var(--gray); border:1px solid var(--gray-bd);}
  .ov-need{display:flex; align-items:flex-start; gap:7px; flex:1 1 240px; min-width:0;}
  .ov-nt{font-size:11px; color:#b2590f; background:#fdece2; border:1px solid #f6cdb4;
    padding:2px 7px; border-radius:20px; font-weight:700; flex:none; margin-top:2px;}
  .ov-chips{display:flex; gap:5px; flex-wrap:wrap; min-width:0;}
  .stu-chip{
    font-size:12px; font-weight:700; border-radius:20px; padding:2px 10px; line-height:20px;
    display:inline-flex; align-items:center; gap:4px; transition:.12s; border:1px solid transparent;
  }
  .stu-chip.miss{background:#fff; color:var(--red); border-color:var(--red-bd);}
  .stu-chip.late{background:#fff; color:var(--orange); border-color:var(--orange-bd);}
  .stu-chip:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm); background:#fff;}
  .stu-chip.miss:hover{border-color:var(--red);}
  .stu-chip.late:hover{border-color:var(--orange);}
  .ov-all{font-size:13px; font-weight:700; color:var(--green); background:var(--green-bg);
    border:1px solid var(--green-bd); padding:5px 13px; border-radius:20px; flex:none;}
  .ov-acts{display:flex; gap:6px; flex:none; margin-left:auto;}
  .ov-btn{
    border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 12px;
    font-size:12px; font-weight:700; color:#5a6a86; transition:.15s; white-space:nowrap;
    box-shadow:var(--shadow-sm);
  }
  .ov-btn:hover{border-color:var(--pri); color:var(--pri);}
  .ov-btn.pri{background:linear-gradient(135deg,#4a76f2,#2e56d6); color:#fff; border-color:transparent;}
  .ov-btn.pri:hover{box-shadow:0 5px 12px -3px rgba(46,86,214,.5);}

  /* ---------- 作业表格 ---------- */
  .tbl-box{overflow:auto; border:1px solid var(--line); border-radius:13px;
    max-height:66vh; background:#fff; box-shadow:var(--shadow-sm);}
  table.hw{border-collapse:separate; border-spacing:0; min-width:100%;}
  table.hw th, table.hw td{border-bottom:1px solid var(--line-soft); border-right:1px solid var(--line-soft);}
  table.hw tbody tr:last-child td{border-bottom:none;}
  table.hw thead th{position:sticky; top:0; z-index:5; font-weight:700; font-size:12px; color:#46536b;
    background:linear-gradient(180deg,#f8fafe,#eef2fa); border-bottom:1px solid var(--line);}
  .th-stu{position:sticky; left:0; z-index:10; background:linear-gradient(180deg,#f8fafe,#eef2fa) !important;
    text-align:center; font-size:13px; min-width:74px;}
  th.week{min-width:112px; text-align:center; padding:8px 5px 6px; position:relative;}
  th.week .wl{display:inline-block; max-width:84px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-size:13px; font-weight:800;}
  th.week .menu{
    position:absolute; right:4px; top:5px; width:19px; height:19px; line-height:16px;
    border-radius:6px; color:#9aa8bf; font-size:13px; opacity:0; transition:.12s;
  }
  th.week:hover .menu{opacity:1;}
  th.week .menu:hover{background:#e0e8f8; color:var(--pri);}
  th.week .cnt{font-weight:500; font-size:10px; color:#8fa0b8; margin-top:3px; line-height:1.4;
    display:block; letter-spacing:.2px;}
  th.week .wkbar{display:block; height:5px; border-radius:3px; margin:5px 6px 0;
    background:rgba(70,83,107,.09); overflow:hidden;}

    background:linear-gradient(90deg,#7ba3f8,#3e6df0);}

  th.week .wkbar i.ok{background:linear-gradient(90deg,#7ba3f8,#3e6df0);}
  th.week .wkbar i.mid{background:linear-gradient(90deg,#ffd166,#ef9f1f);}
  th.week .wkbar i.low{background:linear-gradient(90deg,#ff8f97,#e0454f);}
  th.week.last .wl{color:var(--pri);}
  th.week.last::before{content:""; position:absolute; left:6px; right:6px; top:0; height:3px;
    border-radius:0 0 4px 4px; background:linear-gradient(90deg,#5b86f6,#2e56d6);}
  @keyframes wkflash{0%,50%{background:var(--pri-bg);}100%{background:transparent;}}

  /* ---- 两级表头：第一行周汇总（固定高，第二行天表头吸顶错开） ---- */
  thead tr:first-child th.week{height:42px; box-sizing:border-box; padding:4px 5px; top:0; z-index:6;}

    background:linear-gradient(180deg,#f6f9ff,#edf2fb);}

  .dialog .close{margin-top:14px; width:100%; background:linear-gradient(135deg,#4a76f2,#2e56d6);

  #toast{

<script>
'use strict';
/* =========================================================
   数学走班教学工作台
   数据说明：
   - classes[ID].students : [{id,name,tag,note}]
   - classes[ID].seat     : {rows, cols, locked, grid: string[][]}
   - classes[ID].hw       : {weeks:[{id,label}], marks:{weekId:{stuId:{s:'',q:''}}}}
   s: done/miss/late/leave ; q: high/low
   ========================================================= */

const TEACHING_CLASSES = Object.freeze({ IGB: '初三', IG1: '初一', IG3: '初三' });
const TEACHING_VIEWS = new Set(['plan','seat','hw']);
const embeddedTeaching = window.parent !== window;
const requestedTeachingView = new URLSearchParams(location.search).get('view');
document.documentElement.classList.toggle('embedded-teaching', embeddedTeaching);

/* ---------- 行政班配色 ----------
   IGB1=绿 IGB2=红 IGB3=蓝（用户指定）；IG1.x 用可区分色板 */
const CLASS_COLORS = {
  '3.1': {c:'#2161b0', bg:'#e3effc', bd:'#a9c9ef', tx:'#235a9c'},
  '3.2': {c:'#0f9d5c', bg:'#e5f7ee', bd:'#8fd6b2', tx:'#0a7a47'},
  '3.3': {c:'#b16a0b', bg:'#fff2d8', bd:'#efd29a', tx:'#875300'},
  'IGB1': {c:'#0f9d5c', bg:'#e5f7ee', bd:'#8fd6b2', tx:'#0a7a47'},
  'IGB2': {c:'#e0454f', bg:'#fdecee', bd:'#f2aeb4', tx:'#b7333c'},
  'IGB3': {c:'#2e6fc0', bg:'#e3effc', bd:'#a9c9ef', tx:'#235a9c'},
  'IG1.1': {c:'#7c5cd6', bg:'#f0ebfc', bd:'#c9b8ef', tx:'#5f45ab'},
  'IG1.2': {c:'#d5850a', bg:'#fcf2dd', bd:'#f0d49a', tx:'#a86a05'},
  'IG1.3': {c:'#0e9aa7', bg:'#e0f6f8', bd:'#9ed8de', tx:'#0a7a85'},
  'IG1.4': {c:'#5b6b88', bg:'#edf0f6', bd:'#c3ccdd', tx:'#47546e'},
  'IG1.5': {c:'#d5399b', bg:'#fce9f4', bd:'#efaeda', tx:'#ab2c7c'},
  'IG1.6': {c:'#8a6d3b', bg:'#f7f0e4', bd:'#ddc9a6', tx:'#6e5630'}

function classColor(tag){

/* 成绩徽章（受全局成绩锁控制；分数分色：≥70绿 50-69橙 <50红 缺考灰） */
function scoreBadge(st){
  if(!S || S.ui.scoreShown===false) return '';
  if(st.score===undefined || st.score===null || String(st.score).trim()==='') return '';
  const v = String(st.score).trim();
  const n = parseFloat(v);
  let col='#8794a8', bg='#eef1f6';
  if(!isNaN(n)){
    if(n>=70){ col='#0a7a47'; bg='#e5f7ee'; }
    else if(n>=50){ col='#b26a08'; bg='#fcf2dd'; }
    else { col='#b7333c'; bg='#fdecee'; }
  }
  return '<span class="scb" style="color:'+col+';background:'+bg+'" title="分班考试成绩">'+escapeHtml(v)+'</span>';
}

/* ---------- 教学计划：全站独立数据，不修改 classes ---------- */
const PLAN_DAY_LABELS = ['周一','周二','周三','周四','周五','周六','周日'];
const PLAN_GROUPS = ['IG1','IGB','IG3'];
const PLAN_PERIODS = Array.from({length:9},(_,index) => {
  const morning = index < 5;
  const number = morning ? index + 1 : index - 4;
  const session = morning ? '上午' : '下午';
  return {number,session,label:`${session}第 ${number} 节`};
});

function planGroup(lesson) {
  if (PLAN_GROUPS.includes(lesson.group) || lesson.group === 'pending') return lesson.group;
  const grade = String(lesson.grade || '');
  const code = grade.match(/(?:^|\b)(IG1|IGB|IG3)(?![A-Z0-9])/i);
  return code ? code[1].toUpperCase() : grade.includes('初一') ? 'IG1' : 'pending';
}

function planSlotLabel(slot) {
  return PLAN_PERIODS[slot - 1]?.label || '待定节次';
}

function planLessonName(lesson) {
  return lesson.group === 'pending' ? `${lesson.grade || '旧计划'} · 待分班` : lesson.group;
}

function emptyPlanHomework() {
  return {IG1:'', IGB:'', IG3:'', g9:'', other:''};
}

function mergePlanHomework(original, addition) {
  if (!addition || original.trim() === addition.trim()) return original;
  return original ? original + '\n' + addition : addition;
}

function ensurePlanDayHomework(day) {
  const homework = emptyPlanHomework(), previous = day.homework;
  if (typeof previous === 'string') homework.other = previous;
  else if (previous && typeof previous === 'object') {
    for (const key of Object.keys(homework)) homework[key] = String(previous[key] ?? '');
    homework.IG1 = mergePlanHomework(homework.IG1,String(previous.g7 ?? ''));
  }
  const migrated = new Set();
  for (const lesson of day.lessons) {
    if (!lesson.homework) continue;
    const key = lesson.group !== 'pending' ? lesson.group : lesson.grade.includes('初三') ? 'g9' : 'other';
    const text = String(lesson.homework);
    const assignment = key + '\0' + text.trim();
    if (!migrated.has(assignment)) homework[key] = mergePlanHomework(homework[key],text);
    migrated.add(assignment);
    delete lesson.homework;
  }
  day.homework = homework;
  return homework;
}

function normalizePlanDay(day, index) {
  day.label = PLAN_DAY_LABELS[index];
  const used = new Set();
  day.lessons = (Array.isArray(day.lessons) ? day.lessons : []).map(lesson => {
    const slot = Number(lesson.slot);
    const group = planGroup(lesson);
    const available = Number.isInteger(slot) && slot >= 1 && slot <= PLAN_PERIODS.length && !used.has(slot);
    if (available && group !== 'pending') used.add(slot);
    return {...lesson, grade:String(lesson.grade || ''), group, slot:available && group !== 'pending' ? slot : null,
      content:String(lesson.content ?? ''), note:String(lesson.note ?? '')};
  });
  ensurePlanDayHomework(day);
  return day;
}

function makePlanWeek(number) {
  return {id:'plan_w'+number,label:'第'+number+'周',
    days:PLAN_DAY_LABELS.map(label => ({label,lessons:[],homework:emptyPlanHomework()}))};
}

function normalizePlan(s) {
  s.plan ??= {weekSeq:1,activeWeekId:'plan_w1',weeks:[makePlanWeek(1)]};
  const plan = s.plan;
  if (!Array.isArray(plan.weeks) || !plan.weeks.length) plan.weeks = [makePlanWeek(1)];
  plan.weekSeq = Math.max(Number(plan.weekSeq)||0,plan.weeks.length);
  plan.weeks.forEach((week,index) => {
    week.id ||= 'plan_w'+(index+1);
    week.label = String(week.label || ('第'+(index+1)+'周'));
    week.days = PLAN_DAY_LABELS.map((_,i) => normalizePlanDay(week.days?.[i] || {},i));
  });
  for (const change of plan.history || []) {
    if (Array.isArray(change.days) && change.days.length === PLAN_DAY_LABELS.length) change.days.forEach(normalizePlanDay);
  }
  if (!plan.weeks.some(week => week.id === plan.activeWeekId)) plan.activeWeekId = plan.weeks[0].id;
}

function activePlanWeek() {
  return S.plan.weeks.find(week => week.id === S.plan.activeWeekId) || S.plan.weeks[0];
}

function createPlanWeek(plan, mode='schedule') {
  const source = plan.weeks.find(week => week.id === plan.activeWeekId) || plan.weeks[0];
  let number = Number(plan.weekSeq) || plan.weeks.length;
  do { number++; } while (plan.weeks.some(week => week.id === 'plan_w'+number));
  plan.weekSeq = number;
  const week = makePlanWeek(number);
  if (mode === 'full' && source) week.days = structuredClone(source.days);
  if (mode === 'schedule' && source) {
    source.days.forEach((day,index) => {
      week.days[index].lessons = day.lessons.map(({grade,group,slot}) => ({grade,group,slot,content:'',note:''}));
    });
  }
  plan.weeks.push(week);
  plan.activeWeekId = week.id;
  return week;
}

function currentPlanFilter() {
  return PLAN_GROUPS.includes(S.ui.planGroupFilter) ? S.ui.planGroupFilter : 'all';
}

function rememberPlanChange(label) {
  const week = activePlanWeek();
  if (!Array.isArray(S.plan.history)) S.plan.history = [];
  S.plan.history.push({weekId:week.id,label,days:structuredClone(week.days)});
  S.plan.history = S.plan.history.slice(-20);
}

function lastPlanChangeIndex() {
  const history = S.plan.history || [];
  return history.findLastIndex(change => change.weekId === S.plan.activeWeekId && change.days?.length === 7);
}

function restorePlanChange() {
  const index = lastPlanChangeIndex();
  if (index < 0) return false;
  const [change] = S.plan.history.splice(index,1);
  activePlanWeek().days = structuredClone(change.days);
  return true;
}

function planGroupClass(group) {
  return group === 'all' ? 'all' : group.toLowerCase();
}

function planOverview(week, counts) {
  const rows = PLAN_PERIODS.map((period,index) => {
    const slot = index + 1;
    const starts = index === 0 || index === 5;
    const cells = week.days.map((day,dayIndex) => {
      const lessonIndex = day.lessons.findIndex(lesson => lesson.slot === slot);
      if (lessonIndex < 0) return `<td><button type="button" class="plan-slot plan-slot-empty" data-plan-edit="${dayIndex}" data-plan-lesson="-1" data-plan-slot="${slot}" aria-label="安排${day.label}${period.label}">＋</button></td>`;
      const lesson = day.lessons[lessonIndex];
      const title = lesson.content || '填写教学内容';
      return `<td><button type="button" class="plan-slot plan-slot-filled ${planGroupClass(lesson.group)}" data-plan-edit="${dayIndex}" data-plan-lesson="${lessonIndex}" aria-label="编辑${day.label}${period.label} ${lesson.group}" title="${escapeHtml(title)}"><strong class="plan-slot-group">${lesson.group}</strong><span class="plan-slot-title">${escapeHtml(title)}</span></button></td>`;
    }).join('');
    return `<tr${starts ? ` class="${index === 0 ? 'plan-am-start' : 'plan-pm-start'}"` : ''}><th class="plan-period" scope="row" aria-label="${period.label}">${starts ? `<span class="plan-session">${period.session}</span>` : ''}<span class="plan-period-number">第 ${period.number} 节</span></th>${cells}</tr>`;
  }).join('');
  const days = week.days.map(day => `<th scope="col">${day.label}<small>${day.lessons.filter(lesson => lesson.slot).length} 节</small></th>`).join('');
  return `<p class="plan-guidance">点击空节次排课，点击已有课程可编辑内容或调课。选班级填写每天的作业。</p>
    <div class="plan-timetable-wrap" tabindex="0" aria-label="七天课表，可横向滚动">
      <table class="plan-timetable"><caption>本周课时总览 <span>已排 ${counts.all} 节${counts.pending ? ` · 待安排 ${counts.pending} 节` : ''}</span></caption>
        <colgroup><col class="plan-period-col"><col span="7"></colgroup>
        <thead><tr><th scope="col">节次</th>${days}</tr></thead><tbody>${rows}</tbody></table>
    </div>${planPending(week)}`;
}

function planCourseButton(day,index,lesson) {
  const label = planSlotLabel(lesson.slot);
  return `<button type="button" class="plan-lesson ${planGroupClass(lesson.group)}" data-plan-edit="${day}" data-plan-lesson="${index}" aria-label="编辑${PLAN_DAY_LABELS[day]}${label} ${escapeHtml(planLessonName(lesson))}">
    <span class="plan-lesson-top"><span class="grade">${escapeHtml(planLessonName(lesson))}</span><span class="plan-order">${label}</span></span>
    <span class="plan-line">${lesson.content ? escapeHtml(lesson.content) : '<span class="blank">填写教学内容</span>'}</span>
    ${lesson.note ? `<span class="plan-note">${escapeHtml(lesson.note)}</span>` : ''}
  </button>`;
}

function planPending(week) {
  let count = 0, homeworkCount = 0;
  const days = week.days.map((day,dayIndex) => {
    const lessons = day.lessons.map((lesson,index) => {
      if (lesson.slot) return '';
      count++;
      return planCourseButton(dayIndex,index,lesson);
    }).join('');
    const homework = [['g9','初三作业 · 待分班'],['other','其他旧作业 · 待分班']].map(([key,label]) => {
      if (!day.homework[key]) return '';
      homeworkCount++;
      return `<div class="plan-pending-hw"><strong>${label}</strong><p>${escapeHtml(day.homework[key])}</p><button class="plan-btn" type="button" data-plan-place-hw="${dayIndex}" data-plan-old-hw="${key}">分配作业</button></div>`;
    }).join('');
    return lessons || homework ? `<section class="plan-pending-day"><h3>${day.label}</h3>${lessons}${homework}</section>` : '';
  }).join('');
  return count || homeworkCount ? `<details class="plan-pending-panel" open>
    <summary>待安排的旧计划 <span>${count ? `${count} 节课` : ''}${count && homeworkCount ? ' · ' : ''}${homeworkCount ? `${homeworkCount} 份作业` : ''}</span></summary>
    <p>旧计划里的课程已保留。点击课程补选节次；标为「待分班」的初三记录还需选定班级。</p>
    <div class="plan-pending-grid">${days}</div>
  </details>` : '';
}

function planClassDetail(week, group) {
  return `<p class="plan-guidance">点击课程填写节次和教学内容。当天作业按班级保存。</p><div class="plan-grid">
    ${week.days.map((day,dayIndex) => {
      const courses = day.lessons.map((lesson,index) => ({lesson,index})).filter(item => item.lesson.group === group)
        .sort((a,b) => (a.lesson.slot || 10) - (b.lesson.slot || 10));
      const pending = courses.filter(({lesson}) => !lesson.slot).length;
      const homeworkId = `planHw-${dayIndex}-${group}`;
      return `<section class="plan-day${dayIndex >= 5 ? ' weekend' : ''}" aria-label="${day.label} ${group} 计划">
        <div class="plan-day-head"><h3 class="plan-day-name">${day.label}</h3><span class="plan-day-count">${courses.length - pending} 节${pending ? ` · ${pending} 节待排` : ''}</span></div>
        ${courses.length ? `<div class="plan-day-actions"><button type="button" data-plan-transfer="${dayIndex}">调课 / 复制</button><button type="button" class="plan-clear" data-plan-clear="${dayIndex}">清空当天课程</button></div>` : ''}
        <div class="plan-lessons">${courses.map(({lesson,index}) => planCourseButton(dayIndex,index,lesson)).join('') || '<p class="plan-empty">当天暂无课程</p>'}</div>
        <button type="button" class="plan-add" data-plan-edit="${dayIndex}" data-plan-lesson="-1" aria-label="为${group}添加${day.label}课程">＋ 添加一节课</button>
        <div class="plan-homework"><label class="plan-homework-label ${planGroupClass(group)}" for="${homeworkId}">当天作业</label>
          <textarea id="${homeworkId}" class="plan-homework-input" rows="3" data-plan-homework="${dayIndex}" aria-label="${day.label} ${group} 当天作业" placeholder="填写要布置的作业…">${escapeHtml(day.homework[group])}</textarea>
        </div>
      </section>`;
    }).join('')}
  </div>`;
}

function renderPlan() {
  const week = activePlanWeek(), filter = currentPlanFilter(), undoIndex = lastPlanChangeIndex();
  const counts = {all:0, IG1:0, IGB:0, IG3:0, pending:0};
  for (const day of week.days) for (const lesson of day.lessons) {
    if (!lesson.slot) {
      counts.pending++;
      continue;
    }
    counts[lesson.group]++;
    counts.all++;
  }
  const filters = ['all', ...PLAN_GROUPS].map(group =>
    `<button type="button" class="plan-filter ${planGroupClass(group)}${filter === group ? ' active' : ''}" aria-pressed="${filter === group}" data-plan-filter="${group}">${group === 'all' ? '总览' : group}<em>${counts[group]} 节</em></button>`
  ).join('');
  document.getElementById('main').innerHTML = `<div class="plan-page">
    <div class="plan-heading"><h2>${filter === 'all' ? '周课表' : `${filter} 教学计划`}</h2>
      <div class="plan-controls"><select id="planWeekSelect" class="plan-week-select" aria-label="选择教学周">
        ${S.plan.weeks.map(item => `<option value="${escapeHtml(item.id)}"${item.id === week.id ? ' selected' : ''}>${escapeHtml(item.label)}</option>`).join('')}
      </select><button type="button" class="plan-btn" id="newPlanWeek">新建一周</button></div>
    </div>
    <div class="plan-toolbar">
      <div class="plan-grade-filter" role="group" aria-label="选择总览或教学班">${filters}</div>
      <button type="button" id="undoPlan" class="plan-btn plan-undo" ${undoIndex < 0 ? 'disabled' : ''} title="${undoIndex < 0 ? '本周暂无可撤销的调整' : escapeHtml(S.plan.history[undoIndex].label)}">撤销上次调整</button>
    </div>
    ${filter === 'all' ? planOverview(week,counts) : planClassDetail(week,filter)}
    <p class="plan-footer">修改自动保存在本机。</p>
  </div>`;
  bindPlan();
}

function editPlanLesson(dayIndex,lessonIndex,initialSlot) {
  const week = activePlanWeek(), filter = currentPlanFilter(), isNew = lessonIndex < 0;
  const original = isNew ? {} : week.days[dayIndex].lessons[lessonIndex];
  const preferredGroup = original.group || (filter === 'all' ? '' : filter);
  const preferredSlot = original.slot || initialSlot || '';
  const extra = isNew ? '' : '<button type="button" class="plan-delete" id="deletePlanLesson">删除本节课</button>';
  openPlanDialog(isNew ? '安排课程' : '编辑课程',`<form id="planLessonForm">
    <label class="plan-dialog-label" for="planGroup">教学班</label><select class="plan-dialog-input" id="planGroup" required>
      <option value=""${PLAN_GROUPS.includes(preferredGroup) ? '' : ' selected'} disabled>请选择班级</option>${planGroupOptions(preferredGroup)}
    </select>
    <div class="plan-form-row"><div><label class="plan-dialog-label" for="planDay">上课星期</label>
      <select class="plan-dialog-input" id="planDay">${planDayOptions(dayIndex)}</select></div>
      <div><label class="plan-dialog-label" for="planSlot">上课节次</label><select class="plan-dialog-input" id="planSlot" required></select></div></div>
    <label class="plan-dialog-label" for="planContent">教学内容</label><textarea class="plan-dialog-textarea" id="planContent" placeholder="例如：有理数加法法则">${escapeHtml(original.content || '')}</textarea>
    <label class="plan-dialog-label" for="planNote">备注</label><input class="plan-dialog-input" id="planNote" value="${escapeHtml(original.note || '')}" placeholder="可留空">
    ${planDialogActions(isNew ? '添加课程' : '保存调整',extra)}
  </form>`);
  const daySelect = document.getElementById('planDay'), slotSelect = document.getElementById('planSlot');
  function showSlots(preferred) {
    const occupied = new Map(week.days[Number(daySelect.value)].lessons.filter(lesson => lesson !== original && lesson.slot).map(lesson => [lesson.slot,lesson.group]));
    const selected = preferred && !occupied.has(Number(preferred)) ? Number(preferred) : '';
    slotSelect.innerHTML = `<option value=""${selected ? '' : ' selected'} disabled>请选择节次</option>` + PLAN_PERIODS.map((period,index) => {
      const slot = index + 1;
      const owner = occupied.get(slot);
      return `<option value="${slot}"${slot === selected ? ' selected' : ''}${owner ? ' disabled' : ''}>${period.label}${owner ? `（${owner} 已安排）` : ''}</option>`;
    }).join('');
  }
  showSlots(preferredSlot);
  daySelect.onchange = () => showSlots(slotSelect.value || preferredSlot);
  document.getElementById('planLessonForm').onsubmit = event => {
    event.preventDefault();
    const group = document.getElementById('planGroup').value;
    const day = Number(daySelect.value), slot = Number(slotSelect.value);
    if (!PLAN_GROUPS.includes(group) || !PLAN_PERIODS[slot - 1] ||
      week.days[day].lessons.some(lesson => lesson !== original && lesson.slot === slot)) return;
    const lesson = {...original,grade:TEACHING_CLASSES[group],group,slot,
      content:document.getElementById('planContent').value.trim(),
      note:document.getElementById('planNote').value.trim()};
    rememberPlanChange(isNew ? '添加课程' : '修改课程');
    if (!isNew) week.days[dayIndex].lessons.splice(lessonIndex,1);
    week.days[day].lessons.push(lesson);
    if (filter !== 'all' && filter !== group) S.ui.planGroupFilter = group;
    finishPlanChange(`已保存${PLAN_DAY_LABELS[day]}${planSlotLabel(slot)}`);
  };
  const remove = document.getElementById('deletePlanLesson');
  if (remove) remove.onclick = () => {
    rememberPlanChange('删除课程');
    week.days[dayIndex].lessons.splice(lessonIndex,1);
    finishPlanChange('已删除本节课，可撤销');
  };
}

function clearPlanDayDialog(dayIndex) {

function transferPlanDayDialog(dayIndex) {

function backupRecord(value){
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function backupKey(value){
  return typeof value === 'string' && /^[-_a-zA-Z0-9]{1,100}$/.test(value) && !Object.hasOwn(Object.prototype,value);
}

function validateDays(days){
  if (days == null) return;
  if (!Array.isArray(days) || days.length > 7) throw new Error('教学周日期格式无效');
  days.forEach(day=>{
    if (!backupRecord(day) || (day.lessons != null && (!Array.isArray(day.lessons) || !day.lessons.every(backupRecord)))) {
      throw new Error('教学计划课程格式无效');
    }
  });
}

function prepareTeachingBackup(data, view = requestedTeachingView){
  if (!backupRecord(data) || !backupRecord(data.classes) || !Object.keys(data.classes).length || (data.version != null && ![1,2].includes(data.version))) {
    throw new Error('请选择数学走班工作台的 JSON 备份');
  }
  const next = JSON.parse(JSON.stringify(data));
  for (const [id,c] of Object.entries(next.classes)) {
    if (!Object.hasOwn(TEACHING_CLASSES,id) || !backupRecord(c) || !Array.isArray(c.students)) {
      throw new Error('班级或学生名单格式无效');
    }
    if (c.students.some(st=>!backupRecord(st) || !backupKey(st.id) || typeof st.name !== 'string' || !st.name.trim()) || new Set(c.students.map(st=>st.id)).size !== c.students.length) {
      throw new Error('学生姓名或编号无效，或存在重复编号');
    }
    const seat = c.seat;
    if (seat != null && (!backupRecord(seat) || ['rows','cols'].some(key=>seat[key]!=null&&(!Number.isInteger(seat[key])||seat[key]<0||seat[key]>100)) || (seat.grid != null && (!Array.isArray(seat.grid) || !seat.grid.every(row=>Array.isArray(row)&&row.every(cell=>cell===''||backupKey(cell))))))) {
      throw new Error('座位表格式无效');
    }
    const hw = c.hw;
    if (hw != null && (!backupRecord(hw) || (hw.weeks != null && (!Array.isArray(hw.weeks) || !hw.weeks.every(week=>backupRecord(week)&&backupKey(week.id)&&(week.days==null||(Array.isArray(week.days)&&week.days.every(day=>backupRecord(day)&&backupKey(day.id))))))) || (hw.marks != null && !backupRecord(hw.marks)))) {
      throw new Error('按天作业记录格式无效');
    }
    const chapter = c.chapterHW;
    if (chapter != null && (!backupRecord(chapter) || (chapter.chapters != null && (!Array.isArray(chapter.chapters) || !chapter.chapters.every(ch=>backupRecord(ch)&&backupKey(ch.id)))) || (chapter.marks != null && (!backupRecord(chapter.marks) || !Object.values(chapter.marks).every(marks=>backupRecord(marks)&&Object.values(marks).every(grade=>['A','B','C',''].includes(grade))))))) {
      throw new Error('章节作业或等级格式无效');
    }
    c.id = id;
  }
  if (next.plan != null) {
    if (!backupRecord(next.plan) || (next.plan.weeks!=null&&(!Array.isArray(next.plan.weeks)||!next.plan.weeks.every(backupRecord))) || (next.plan.history!=null&&(!Array.isArray(next.plan.history)||!next.plan.history.every(backupRecord)))) {
      throw new Error('教学计划格式无效');
    }
    for (const week of next.plan.weeks || []) validateDays(week.days);
    for (const change of next.plan.history || []) {
      validateDays(change.days);
      change.days?.forEach((day,i)=>{day.label=PLAN_DAY_LABELS[i];day.lessons=day.lessons||[];});
    }
  }
  next.ui = backupRecord(next.ui) ? next.ui : {};
  if (TEACHING_VIEWS.has(view)) next.ui.view = view;
  delete next._paint;
  delete next._sel;
  normalize(next);
  return next;
}

function normalize(s){
  for (const id of Object.keys(TEACHING_CLASSES)) if (!s.classes[id]) s.classes[id] = buildClass(id);
  s.version = 2;
  s.ui = s.ui || {};
  if (!TEACHING_VIEWS.has(s.ui.view)) s.ui.view = 'plan';
  if(s.ui.scoreShown===undefined) s.ui.scoreShown = false; // 成绩默认锁定隐藏
  if(!Object.hasOwn(s.classes,s.ui.active)) s.ui.active = Object.keys(s.classes)[0];
  Object.keys(s.classes).forEach(function(k){
    const c = s.classes[k];
    c.students = c.students || [];
    c.label = c.label || k;
    c.level = c.level || TEACHING_CLASSES[k];
    c.seq = Number.isSafeInteger(c.seq) && c.seq >= 0 ? c.seq : c.students.length;
    c.students.forEach(function(st){ if(st.score===undefined) st.score=''; });

    c.seat = c.seat || {};
    c.seat.locked = !!c.seat.locked;
    c.seat.rows = Math.max(1, c.seat.rows||1);
    c.seat.cols = Math.max(1, c.seat.cols||5);
    c.hw = c.hw || {};
    c.hw.weeks = (c.hw.weeks && c.hw.weeks.length)? c.hw.weeks : [{id:'w1',label:'第1周'}];
    c.hw.marks = c.hw.marks || {};
    /* ---- v1 → v2：每周展开为“周一~周五”5天；旧的周级记录迁移到周一 ---- */
    c.hw.weeks.forEach(function(w){
      if(!w.days || !w.days.length){
        w.days = makeDays(w.id);
        if(c.hw.marks[w.id]){
          c.hw.marks[w.days[0].id] = c.hw.marks[w.id];
          delete c.hw.marks[w.id];
        }
      }
      /* ---- 补齐缺失的默认天（周一~周五，d1~d5 模式）----
         旧数据每周只有周一~周四，这里自动补上周五；用户手动新增的天（w<id>x<数字>）不受影响 */
      ['周一','周二','周三','周四','周五'].forEach(function(lbl, i){
        const did = w.id + 'd' + (i+1);
        if(!w.days.some(function(d){ return d.id===did; })){
          w.days.push({id:did, label:lbl});
        }
      });
      w.days.forEach(function(d){ if(!c.hw.marks[d.id]) c.hw.marks[d.id] = {}; });
    });
    normalizeChapterHW(c);
    // 座位网格补齐
    const g = c.seat.grid || [];
    const grid = [];
    for(let r=0;r<c.seat.rows;r++){
      const row = [];
      for(let col=0;col<c.seat.cols;col++){
        const v = (g[r] && g[r][col] !== undefined) ? g[r][col] : '';
        row.push(v);
      }
      grid.push(row);
    }
    c.seat.grid = grid;
  });
  normalizePlan(s);
}

/* ---------- 全局工具 ---------- */
function cls(){ return S.classes[S.ui.active]; }
function uid(clsObj, name){
  let id;
  do { id = clsObj.id + '_s' + (++clsObj.seq); }
  while (clsObj.students.some(st=>st.id===id) || clsObj.seat.grid.some(row=>row.includes(id)));
  return id;
}

let workbenchRoster = {};

function isTeachingStudentArchived(c, student) {
  if (!student) return false;
  const group = Object.keys(S.classes).find(key => S.classes[key] === c);
  const roster = workbenchRoster[group] || [];
  const names = roster.filter(entry => entry.name === student.name.trim());
  const numbers = student.schoolId ? names.filter(entry => entry.schoolId === String(student.schoolId)) : [];
  if (numbers.length === 1) return numbers[0].archived === true;
  return names.length === 1 && c.students.filter(entry => entry.name.trim() === student.name.trim()).length === 1 && names[0].archived === true;
}

function teachingVisibleStudents(c) {
  return c.students.filter(student => !isTeachingStudentArchived(c, student));
}

function seatOccupant(c, id) {
  const student = id && c.students.find(student => student.id === id);
  return student && !isTeachingStudentArchived(c, student) ? student : null;
}

function syncTeachingRoster(roster, mergeExisting = false){
  const result = {added:0, matched:0, ambiguous:0};
  if (!backupRecord(roster)) return result;
  for (const id of Object.keys(TEACHING_CLASSES)) {
    const c = S.classes[id];
    if (!Array.isArray(roster[id]) || (!mergeExisting && c.students.length)) continue;
    const wasEmpty = c.students.length === 0;
    for (const entry of roster[id]) {
      if (!backupRecord(entry) || entry.archived === true || typeof entry.name !== 'string' || !entry.name.trim()) continue;
      const name = entry.name.trim();
      const tag = typeof entry.tag === 'string' ? entry.tag.trim() : '';
      const schoolId = typeof entry.schoolId === 'string' ? entry.schoolId.trim() : '';
      const byNumber = schoolId ? c.students.filter(st=>String(st.schoolId||'')===schoolId) : [];
      const byName = c.students.filter(st=>st.name.trim()===name);
      const matches = byNumber.length ? byNumber : byName;
      if (matches.length > 1 || (matches.length === 1 && schoolId && matches[0].schoolId && String(matches[0].schoolId)!==schoolId)) {
        result.ambiguous++;
        continue;
      }
      if (matches.length === 1) {
        const st = matches[0];
        if (schoolId && !st.schoolId) st.schoolId = schoolId;
        if (tag && !st.tag) st.tag = tag;
        result.matched++;
        continue;
      }
      c.students.push({id:uid(c),name,tag,schoolId,score:'',note:''});
      result.added++;
    }
    if (wasEmpty && !c.seat.locked && !c.seat.grid.some(row=>row.some(Boolean))) {
      const rows = Math.ceil(c.students.length / c.seat.cols);
      if (rows > c.seat.rows) resizeGrid(c,rows,c.seat.cols);
    }
  }
  return result;
}
function nameOf(clsObj, id){
  const st = clsObj.students.find(function(x){ return x.id === id; });
  return st ? st.name : '';
}
function seatKey(r,c){ return r + '_' + c; }
function poolOf(clsObj){ // 未入座学生
  const used = {};
  clsObj.seat.grid.forEach(function(row){ row.forEach(function(v){ if(v) used[v]=1; }); });
  return teachingVisibleStudents(clsObj).filter(function(st){ return !used[st.id]; });
}

        const clsSel = (sel && sel.stuId===id)? ' sel' : '';
        stageHtml += '<div class="seat '+clsSel+'" draggable="true" data-id="'+id+'" data-src="'+key+'" data-key="'+key+'" data-r="'+r+'" data-c="'+col+'"'+seatStyle+'>'
          +'<span class="seat-num">'+(r+1)+'-'+(col+1)+'</span>'
          +'<span class="seat-inner">'+avatar(nm)+'<span class="snm">'+escapeHtml(nm)+(scb?' '+scb:'')+'</span>'+tg+'</span>'
          +'<span class="del" data-unseat="'+id+'" title="撤回学生池">✕</span>'
          +'</div>';
      } else {
        stageHtml += '<div class="seat empty" data-key="'+key+'" data-r="'+r+'" data-c="'+col+'">'
          +'<span class="seat-num">'+(r+1)+'-'+(col+1)+'</span><span class="empty-seat-dots"><i></i><i></i><i></i></span></div>';
      }
    }
    stageHtml += '</div>';
  }
  stageHtml += '</div>';

  /* 班级颜色图例 */
  const seen = {};
  students.forEach(function(st){ if(st.tag) seen[st.tag]=1; });
  const tags = Object.keys(seen);
  if(tags.length){
    stageHtml += '<div class="cls-legend"><span class="lg-t">行政班</span>';
    tags.forEach(function(t){
      const cc = classColor(t);
      stageHtml += '<span class="lg-chip"'+(cc?(' style="background:'+cc.bg+';color:'+cc.tx+';border:1px solid '+cc.bd+'"'):'')+'>'+escapeHtml(t)+'</span>';
    });
    stageHtml += '<span class="lg-note">'+(S.ui.scoreShown?'成绩已显示（点 🔒 按钮隐藏，投屏时请锁定）':'成绩已锁定（点 🔒 按钮显示）')+'</span></div>';
  }
  stageHtml += '</div>';

  document.getElementById('main').innerHTML = '<div class="page-card"><div class="seat-wrap">' + poolHtml + stageHtml + '</div></div>';
  bindSeat();
}

function findSeatOf(c, stuId){
  for(let r=0;r<c.seat.rows;r++){
    for(let col=0;col<c.seat.cols;col++){
      if(c.seat.grid[r][col]===stuId) return {r:r, c:col};
    }
  }
  return null;
}

function doMove(stuId, srcKey, tr, tc){
  const c = cls();
  const g = c.seat.grid;
  const cur = findSeatOf(c, stuId);
  // 重复点自己所在座位
  if(cur && cur.r===tr && cur.c===tc) return;
  const targetId = seatOccupant(c,g[tr][tc])?.id;
  if(cur){
    // 从座位移动
    if(targetId){
      // 互换
      g[tr][tc] = stuId;
      g[cur.r][cur.c] = targetId;
    } else {
      g[cur.r][cur.c] = '';
      g[tr][tc] = stuId;
    }
  } else {
    // 从学生池放入
    if(targetId){
      // 原座位者自然回池（grid 覆盖），无需额外处理
    }
    g[tr][tc] = stuId;
  }
}

function bindSeat(){
  const c = cls();
  const seat = c.seat;
  const main = document.getElementById('main');

  /* 点击学生池学生 → 选中 */
  document.getElementById('poolList') && document.getElementById('poolList').querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click', function(ev){
      if(seat.locked) return;
      const id = ch.getAttribute('data-id');
      if(ev.target.getAttribute('data-del') !== null) return; // 交给删除处理
      S._sel = (S._sel && S._sel.stuId===id) ? null : { stuId:id, from:null };
      renderSeat();
    });
  });

  /* 池内删除学生（名单管理） */
  main.querySelectorAll('[data-del]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      const id = el.getAttribute('data-del');
      const st = c.students.find(function(x){return x.id===id;});
      if(!st) return;
      if(!confirm('确定把「'+st.name+'」从本班名单移除？\n其座位与作业记录会一并删除。' )) return;
      removeStudent(id);
      showToast('已移除 ' + st.name);
      renderAll();
    });
  });

  /* 拖动：座位格里的学生（data-src 非空 = 座位来源） */
  main.querySelectorAll('[draggable="true"]').forEach(function(d){
    d.addEventListener('dragstart', function(ev){
      if(seat.locked){ ev.preventDefault(); return; }
      const id = d.getAttribute('data-id');
      const src = d.getAttribute('data-src') || null;
      ev.dataTransfer.setData('text/plain', id);
      ev.dataTransfer.setData('text/src', src||'');
      d.classList.add('dragging');
      S._sel = null;
    });
    d.addEventListener('dragend', function(){ d.classList.remove('dragging'); });
  });

  /* 座位目标 */
  main.querySelectorAll('.seat').forEach(function(cell){
    cell.addEventListener('dragover', function(ev){
      if(seat.locked) return;
      ev.preventDefault();
      cell.classList.add('dropover');
    });
    cell.addEventListener('dragleave', function(){ cell.classList.remove('dropover'); });
    cell.addEventListener('drop', function(ev){
      ev.preventDefault();
      cell.classList.remove('dropover');
      if(seat.locked) return;
      const id = ev.dataTransfer.getData('text/plain');
      const src = ev.dataTransfer.getData('text/src') || '';
      const r = +cell.getAttribute('data-r'), col = +cell.getAttribute('data-c');
      doMove(id, src||null, r, col);
      renderSeat();
      saveAndFlash();
    });
    /* 点击座位 */
    cell.addEventListener('click', function(ev){
      if(seat.locked) return;
      if(ev.target.getAttribute('data-unseat')!==null) return;
      const r = +cell.getAttribute('data-r'), col = +cell.getAttribute('data-c');
      const id = seat.grid[r][col];
      if(!S._sel){
        if(id){ S._sel = {stuId:id, from:seatKey(r,col)}; renderSeat(); }
        return;
      }
      if(S._sel.stuId===id){ S._sel=null; renderSeat(); return; }
      doMove(S._sel.stuId, S._sel.from, r, col);
      S._sel = null;
      renderSeat();
      saveAndFlash();
    });
    /* 点座位上的撤座 */
    const un = cell.querySelector('[data-unseat]');
    if(un) un.addEventListener('click', function(ev){
      ev.stopPropagation();
      const id = un.getAttribute('data-unseat');
      const pos = findSeatOf(c, id);
      if(pos){ c.seat.grid[pos.r][pos.c]=''; }
      S._sel = null;
      renderSeat();
      saveAndFlash();
    });
  });

  /* 学生池作为拖放目标（把学生拖回池） */
  const poolWrap = document.querySelector('.pool-col');
  if(poolWrap){
    poolWrap.addEventListener('dragover', function(ev){
      if(seat.locked) return;
      if(Array.from(ev.dataTransfer.types || []).includes('text/plain')){ ev.preventDefault(); poolWrap.classList.add('over'); }
    });
    poolWrap.addEventListener('dragleave', function(){ poolWrap.classList.remove('over'); });
    poolWrap.addEventListener('drop', function(ev){
      ev.preventDefault();
      poolWrap.classList.remove('over');
      if(seat.locked) return;
      const id = ev.dataTransfer.getData('text/plain');
      const pos = findSeatOf(c, id);
      if(pos){ c.seat.grid[pos.r][pos.c]=''; }
      S._sel = null;
      renderSeat();
      saveAndFlash();
    });
  }
}

function removeStudent(id){
  const c = cls();
  const pos = findSeatOf(c, id);
  if(pos) c.seat.grid[pos.r][pos.c] = '';
  c.students = c.students.filter(function(x){ return x.id!==id; });
  // 清作业
  Object.keys(c.hw.marks).forEach(function(key){delete c.hw.marks[key][id];});
  Object.keys(c.chapterHW.marks).forEach(function(key){delete c.chapterHW.marks[key][id];});
}

function addStudent(name){
  name = (name||'').trim();
  if(!name) return;
  let stuName = name, tag = '';
  const sp = name.split(/[\s　]+/);
  if(sp.length>=2){
    stuName = sp[0];
    tag = sp.slice(1).join('');
  }
  const c = cls();
  const st = { id: uid(c, stuName), name: stuName, tag: tag, note:'' };
  c.students.push(st);
}

/* 章节作业：独立保存，旧版按天记录继续保留在 hw 中。 */
function normalizeChapterHW(c){
  if(!c.chapterHW) c.chapterHW = {chapters:[], marks:{}, seq:0};
  const hw = c.chapterHW;
  hw.chapters = Array.isArray(hw.chapters) ? hw.chapters : [];
  hw.marks = hw.marks || {};
  hw.seq = Number(hw.seq) || 0;
  hw.chapters.forEach(function(ch){ if(!hw.marks[ch.id]) hw.marks[ch.id] = {}; });
}
function addChapter(c, label){
  label = String(label || '').trim().slice(0,80);
  if(!label) return null;
  const hw = c.chapterHW;
  let id;
  do { id = c.id + '_chapter_' + (++hw.seq); } while(hw.chapters.some(function(ch){ return ch.id===id; }));
  const chapter = {id:id, label:label};
  hw.chapters.push(chapter);
  hw.marks[id] = {};
  return chapter;
}
function setChapterGrade(c, chapterId, studentId, grade){
  if(!['A','B','C',''].includes(grade)) throw new Error('无效等级');
  if(!c.chapterHW.chapters.some(function(ch){ return ch.id===chapterId; }) ||
     !c.students.some(function(st){ return st.id===studentId; })) throw new Error('章节或学生不存在');
  if(grade) c.chapterHW.marks[chapterId][studentId] = grade;
  else delete c.chapterHW.marks[chapterId][studentId];
}
function closeGradePicker(restoreFocus){
  const pop = document.getElementById('menuPop');
  if(!pop) return;
  const source = pop._source;
  pop.style.display='none'; pop.innerHTML=''; pop._source=null;
  if(source) source.setAttribute('aria-expanded','false');
  if(restoreFocus && source && source.isConnected) source.focus();
}
function openGradePicker(button){
  closeGradePicker();
  const c = cls();
  const chId = button.dataset.chapter, sid = button.dataset.student;
  const ch = c.chapterHW.chapters.find(function(x){return x.id===chId;});
  const student = c.students.find(function(x){return x.id===sid;});
  const value = c.chapterHW.marks[chId][sid] || '';
  const pop = document.getElementById('menuPop');
  pop.className='menu-pop chapter-picker';
  pop.setAttribute('role','dialog');
  pop.setAttribute('aria-label',student.name+'的作业等级');
  pop.innerHTML='<div class="grade-context">'+escapeHtml(student.name)+' <span>· '+escapeHtml(ch.label)+'</span></div>'
    +'<div class="grade-options">'+['A','B','C'].map(function(g){
      return '<button type="button" class="grade-option grade-'+g+'" data-grade="'+g+'" aria-pressed="'+(value===g)+'">'+g+'</button>';
    }).join('')+'</div><button type="button" class="grade-clear" data-grade="">清空</button>';
  pop._source=button;
  button.setAttribute('aria-expanded','true');
  pop.style.display='block';
  const rect=button.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(rect.left+(rect.width-248)/2,window.innerWidth-256))+'px';
  pop.style.top=Math.max(8,Math.min(rect.bottom+6,window.innerHeight-pop.offsetHeight-8))+'px';
  pop.querySelectorAll('[data-grade]').forEach(function(option){
    option.addEventListener('click',function(){
      const grade=option.dataset.grade;
      setChapterGrade(c,chId,sid,grade);

      button.textContent=grade || '—';
      button.setAttribute('aria-label',student.name+'，'+ch.label+'，'+(grade||'未登记')+'，选择等级');
      closeGradePicker(true); saveAndFlash();
    });

  pop.querySelector('[data-grade="'+value+'"]').focus();
}
function renameChapter(chapterId){
  const c=cls(), ch=c.chapterHW.chapters.find(function(x){return x.id===chapterId;});
  if(!ch) return;

  mask.classList.add('show');

  document.getElementById('cancelChapterRename').onclick=function(){mask.classList.remove('show');};
  document.getElementById('renameChapterForm').onsubmit=function(e){
    e.preventDefault(); const value=input.value.trim();

}
/* 仅对显示副本分组，不修改学生数组、编号、登记记录或座位。 */
function groupedHomeworkStudents(c){
  return teachingVisibleStudents(c).map(function(st,index){return {student:st,index:index};})
    .sort(function(a,b){
      const at=String(a.student.tag||'').trim(), bt=String(b.student.tag||'').trim();
      if(at===bt) return a.index-b.index;
      if(!at) return 1;
      if(!bt) return -1;
      return at.localeCompare(bt,'zh-CN',{numeric:true}) || a.index-b.index;
    }).map(function(entry){return entry.student;});
}
function homeworkNameColor(st){
  const tag=String(st.tag||'').trim();
  const colors={IGB1:'#235a9c',IGB2:'#0a7a47',IGB3:'#946c00'};
  const existing=classColor(tag);
  return colors[tag] || (existing?existing.tx:'#34445e');
}

function renderHW(){
  closeGradePicker();
  const c=cls(), hw=c.chapterHW;
  let html='<div class="chapter-page"><div class="chapter-heading"><div><h2>章节作业</h2><p>自定义章节或作业名称 · 点击格子选择 A / B / C</p></div>'
    +'<form id="addChapterForm" class="chapter-add"><input class="chapter-input" id="chapterName" aria-label="新章节或作业名称" placeholder="如：第一章 · 有理数加法" maxlength="80" required><button type="submit" class="chapter-primary">＋ 添加章节</button></form></div>';
  if(!hw.chapters.length){
    html+='<div class="chapter-empty"><div class="chapter-empty-symbol">A <span>B</span> C</div><h3>从第一份章节作业开始</h3><p>在上方填写章节或作业名称，添加后即可逐人登记等级。</p></div>';
  }else{
    html+='<div class="chapter-table-scroll"><table class="chapter-table"><thead><tr><th scope="col" class="chapter-student-head">学生 <span> / '+teachingVisibleStudents(c).length+' 人</span></th>';
    hw.chapters.forEach(function(ch){
      html+='<th scope="col"><button type="button" class="chapter-title" data-rename-chapter="'+escapeHtml(ch.id)+'" title="点击修改名称">'+escapeHtml(ch.label)+'<span aria-hidden="true"> ✎</span></button></th>';
    });
    html+='</tr></thead><tbody>';
    let previousTag=null;
    groupedHomeworkStudents(c).forEach(function(st){
      const tag=String(st.tag||'').trim();
      const groupStart=previousTag!==null && previousTag!==tag;
      previousTag=tag;
      html+='<tr'+(groupStart?' class="admin-group-start"':'')+'><th scope="row"><div class="chapter-student"><div><b style="color:'+homeworkNameColor(st)+'">'+escapeHtml(st.name)+'</b><small style="color:'+homeworkNameColor(st)+'">'+escapeHtml(st.tag)+'</small></div></div></th>';
      hw.chapters.forEach(function(ch){
        const grade=hw.marks[ch.id][st.id]||'';
        html+='<td><button type="button" class="grade-cell'+(grade?' grade-'+grade:'')+'" data-chapter="'+escapeHtml(ch.id)+'" data-student="'+escapeHtml(st.id)+'" aria-haspopup="dialog" aria-expanded="false" aria-label="'+escapeHtml(st.name+'，'+ch.label+'，'+(grade||'未登记')+'，选择等级')+'">'+(grade||'—')+'</button></td>';
      });
      html+='</tr>';
    });
    html+='</tbody></table></div><div class="chapter-footer"><span>'+hw.chapters.length+' 项章节作业 · 点击表头可修改名称</span><button type="button" data-act="exportCSV">导出本班表格</button></div>';
  }
  html+='</div>';
  document.getElementById('main').innerHTML=html;
  document.getElementById('addChapterForm').onsubmit=function(e){
    e.preventDefault(); const input=document.getElementById('chapterName');
    const ch=addChapter(c,input.value);
    if(!ch){input.focus();return;}
    renderHW();saveAndFlash();
    const scroll=document.querySelector('.chapter-table-scroll');
    if(scroll) scroll.scrollLeft=scroll.scrollWidth;
    document.getElementById('chapterName').focus();
  };
  document.querySelectorAll('[data-rename-chapter]').forEach(function(button){button.onclick=function(){renameChapter(button.dataset.renameChapter);};});
  document.querySelectorAll('.grade-cell').forEach(function(button){button.onclick=function(){openGradePicker(button);};});
  const scroll=document.querySelector('.chapter-table-scroll');
  if(scroll) scroll.addEventListener('scroll',function(){closeGradePicker();});
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const ds = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  a.href = URL.createObjectURL(blob);
  a.download = '数学走班工作台备份_'+ds+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 200);
  showToast('备份已导出');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = prepareTeachingBackup(JSON.parse(reader.result), S.ui.view);
      const hasRecords = Object.values(S.classes).some(c=>c.students.length||c.chapterHW.chapters.length)
        || S.plan.weeks.length>1 || S.plan.history?.length
        || S.plan.weeks.some(week=>week.days.some(day=>Object.values(day.homework).some(Boolean)||day.lessons.length));
      if (hasRecords && !confirm('导入备份将替换教学计划、座位和作业记录。继续导入？')) return;
      try { localStorage.setItem(LS_KEY,JSON.stringify(data)); }
      catch(e){ throw new Error('浏览器无法保存，请检查本地存储空间'); }
      S = data;
      storeOK = true;
      renderAll();
      showToast('备份导入成功');
    }catch(e){
      alert('无法导入备份：' + e.message);
    }
  };
  reader.readAsText(file);
}

function exportCSV(){
  const c=cls(), hw=c.chapterHW;
  const rows=[['学生','行政班'].concat(hw.chapters.map(function(ch){return ch.label;}))];
  teachingVisibleStudents(c).forEach(function(st){rows.push([st.name,st.tag||''].concat(hw.chapters.map(function(ch){return hw.marks[ch.id][st.id]||'';})));});
  const csv=rows.map(function(row){return row.map(function(v){v=String(v);if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=c.label+'_章节作业.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href);},200);
  showToast('已导出 '+c.label+' 章节作业');
}

  document.getElementById('mask').classList.add('show');

/* =========================================================
   入口 & 全局事件
   ========================================================= */
function renderAll(){
  closeGradePicker();
  S.ui.active = S.ui.active || Object.keys(S.classes)[0];
  renderTop();
  if(S.ui.view==='plan') renderPlan();
  else if(S.ui.view==='hw') renderHW();
  else renderSeat();
}

function sendTeachingMessage(message){
  if (embeddedTeaching) window.parent.postMessage(message, location.protocol==='file:' ? '*' : location.origin);
}

function selectTeachingView(view, notifyParent){
  if (!TEACHING_VIEWS.has(view)) return;
  if (S.ui.view !== view) closePlanDialog();
  S._paint = null;
  S.ui.view = view;
  renderAll();
  if (notifyParent) sendTeachingMessage({type:'math-teaching:route',view});
}

window.addEventListener('message', event=>{
  const expectedOrigin = location.protocol==='file:' ? 'null' : location.origin;
  if (!embeddedTeaching || event.source!==window.parent || event.origin!==expectedOrigin || !backupRecord(event.data)) return;
  const {type,view,roster} = event.data;
  if (type==='math-teaching:set-view' && TEACHING_VIEWS.has(view)) {
    if (backupRecord(roster)) workbenchRoster = roster;
    syncTeachingRoster(roster);
    selectTeachingView(view,false);
  } else if (type==='math-teaching:sync-roster' && backupRecord(roster)) {
    workbenchRoster = roster;
    const result = syncTeachingRoster(roster,true);
    renderAll();
    sendTeachingMessage({type:'math-teaching:roster-synced',...result});
  }
});

document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-act]');
  if(!t) return;
  const act = t.getAttribute('data-act');
  if(act==='switchClass'){ S.ui.active = t.getAttribute('data-id'); S._sel=null; renderAll(); }
  else if(act==='switchView') selectTeachingView(t.getAttribute('data-view'),true);
  else if(act==='autoFill'){
    const c = cls();
    const pool = poolOf(c);
    let p = 0;
    for(let r=0;r<c.seat.rows;r++){
      for(let col=0;col<c.seat.cols;col++){
        if(!seatOccupant(c,c.seat.grid[r][col]) && p<pool.length){ c.seat.grid[r][col]=pool[p++].id; }
      }
    }
    renderSeat(); saveAndFlash(); showToast('已按名单顺序占位，可继续拖拽调整');
  }
  else if(act==='clearSeats'){
    if(confirm('清空当前班级全部座位（学生回到学生池）？')){
      const c = cls();
      c.seat.grid.forEach(function(row){ row.forEach(function(id,i){ if(seatOccupant(c,id)) row[i]=''; }); });
      S._sel = null;
      renderSeat(); saveAndFlash();
    }
  }
  else if(act==='printSeat'){ printSeat(); }
  else if(act==='rowPlus'||act==='rowMinus'||act==='colPlus'||act==='colMinus'){
    const c = cls();
    let dr=0, dc=0;
    if(act==='rowPlus') dr=1; else if(act==='rowMinus') dr=-1;
    if(act==='colPlus') dc=1; else if(act==='colMinus') dc=-1;
    resizeGrid(c, c.seat.rows+dr, c.seat.cols+dc);
    renderSeat(); saveAndFlash();
  }
  else if(act==='toggleScore'){
    S.ui.scoreShown = !S.ui.scoreShown;
    renderAll(); saveLS();
    showToast(S.ui.scoreShown? '成绩已显示——投屏时注意隐私' : '成绩已锁定隐藏');
  }
  else if(act==='exportCSV'){ exportCSV(); }
  else if(act==='hwBackToSeat') selectTeachingView('seat',true);
});

/* 行/列增减 */
function resizeGrid(c, rows, cols){
  rows = Math.max(1, Math.min(12, rows));
  cols = Math.max(1, Math.min(12, cols));
  const ng = [];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let col=0;col<cols;col++){
      const v = (c.seat.grid[r] && c.seat.grid[r][col]!==undefined) ? c.seat.grid[r][col] : '';
      row.push(v);
    }
    ng.push(row);
  }
  c.seat.rows = rows; c.seat.cols = cols; c.seat.grid = ng;
}

/* 顶栏动作绑定 */
document.getElementById('btnExport').addEventListener('click', exportJSON);
document.getElementById('btnImport').addEventListener('click', function(){ document.getElementById('fileImport').click(); });
document.getElementById('fileImport').addEventListener('change', function(){
  if(this.files && this.files[0]) importJSON(this.files[0]);
  this.value='';
});
document.getElementById('btnHelp').addEventListener('click', showHelp);

/* main 事件委托：座位页添加学生 */
document.getElementById('main').addEventListener('keydown', function(ev){
  if(ev.key==='Enter' && ev.target && ev.target.id==='addName'){
    const btn = document.getElementById('addStu');
    if(btn) btn.click();
  }
});
document.getElementById('main').addEventListener('click', function(ev){
  const t = ev.target;
  if(t && t.id==='addStu'){
    const inp = document.getElementById('addName');
    const name = inp? inp.value : '';
    if(name.trim()){ addStudent(name); renderSeat(); saveAndFlash(); showToast('已添加 ' + name.trim().split(/[\s　]+/)[0]); }
  }
});
/* main 事件委托：锁定座位开关（checkbox change） */
document.getElementById('main').addEventListener('change', function(ev){
  if(ev.target && ev.target.id==='lockSeat'){
    const c = cls();
    c.seat.locked = ev.target.checked;
    S._sel = null;
    renderSeat();
    saveAndFlash();
    showToast(c.seat.locked? '座位已锁定，解锁后可继续调整':'座位已解锁');
  }
});
/* main 事件委托：作业页行内 ✕ 移除名单 */
document.getElementById('main').addEventListener('click', function(ev){
  const t = ev.target.closest('[data-delstu]');
  if(!t) return;
  const c = cls();
  const id = t.getAttribute('data-delstu');
  const st = c.students.find(function(x){ return x.id===id; });
  if(!st) return;
  if(confirm('确定把「'+st.name+'」从本班名单移除？其座位与作业记录一并删除。')){
    removeStudent(id);
    renderAll();
    showToast('已移除 ' + st.name);
  }
});

/* 遮罩点击关闭帮助 */
document.getElementById('mask').addEventListener('click', function(ev){
  if(ev.target && ev.target.id==='mask'){if(document.getElementById('dialogBox').dataset.planDialog)closePlanDialog();else this.classList.remove('show');}
});

/* 章节等级：点击外部、滚动窗口或 Escape 关闭选择器。 */
document.addEventListener('click',function(e){
  if(!e.target.closest('#menuPop') && !e.target.closest('.grade-cell')) closeGradePicker();
});
window.addEventListener('resize',function(){closeGradePicker();});
window.addEventListener('scroll',function(){closeGradePicker();});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  closeGradePicker(true);
  document.getElementById('mask').classList.remove('show');
  if(S._sel){S._sel=null;if(S.ui.view==='seat')renderSeat();}
});

document.addEventListener('keydown',function(e){
  const box=document.getElementById('dialogBox'),mask=document.getElementById('mask');
  if(!box.dataset.planDialog)return;
  if(e.key==='Escape'){closePlanDialog();return;}
  if(e.key!=='Tab'||!mask.classList.contains('show'))return;
  const items=Array.from(box.querySelectorAll('button:not(:disabled),input,textarea,select')).filter(el=>el.getClientRects().length);
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
/* 启动 */
renderAll();
saveAndFlash();
</script>
